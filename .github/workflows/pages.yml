# .github/workflows/pages.yml
name: Live demo

on:
  push:
    branches: [main]
    paths: ["site/**", "tests/**", "package.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: node --test "tests/*.test.mjs"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Stamp the short commit SHA into every relative module URL (and the hero image)
      # of the uploaded copy only, so returning visitors never mix cached old files with new ones.
      # KEEP IN SYNC with the regexes in tests/deploy.test.mjs.
      - name: Version module URLs
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(src=\"\./app\.js)\"#\1?v=${v}\"#" site/index.html
          sed -i -E "s#(href=\"\./app\.css)\"#\1?v=${v}\"#" site/index.html
          sed -i -E "s#(src: \"\./assets/hero\.jpg)\"#\1?v=${v}\"#" site/app.js
          find site -name '*.js' -print0 | xargs -0 sed -i -E "s#(from \"\.{1,2}/[^\"]+\.js)\"#\1?v=${v}\"#g"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
